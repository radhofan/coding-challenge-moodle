server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;
    client_header_buffer_size 128k;
    large_client_header_buffers 4 128k;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;                      # Forwards matching /api/ requests to backend container on port 8080
        proxy_http_version 1.1;                                   # Uses HTTP/1.1 for backend proxy communication
        proxy_set_header Host $host;                              # Preserves original request host header
        proxy_set_header X-Real-IP $remote_addr;                  # Passes client IP address to backend
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Appends client IP to proxy chain header
        proxy_set_header X-Forwarded-Proto $scheme;               # Passes original scheme (http/https) to backend
        proxy_set_header Cookie "";                               # Strips incoming browser cookies before forwarding to backend
        proxy_read_timeout 300s;                                  # Waits up to 300s for backend PHP to respond
        proxy_connect_timeout 300s;                               # Waits up to 300s to establish connection with backend
        proxy_send_timeout 300s;                                  # Waits up to 300s to transmit request to backend

        proxy_buffer_size 128k;                                   # Memory buffer for reading initial backend response header
        proxy_buffers 4 256k;                                     # Memory buffers for reading backend response body
        proxy_busy_buffers_size 256k;                             # Buffer limit while streaming response to client
    }
}
